name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Build and run end-to-end test
        run: |
          cd server
          go build -o ../RemoteDesktop-test.exe .
          cd ..
          python tools/e2e_test.py RemoteDesktop-test.exe test-out
      - name: Publish test results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ci-test --yes --cleanup-tag || true
          gh release create ci-test test-out/* --prerelease --target "$GITHUB_SHA" --title "CI test (Windows)" --notes "Run ${{ github.run_id }}"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          mkdir -p dist logs

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Server (Windows exe)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq binutils-mingw-w64-x86-64 gcc-mingw-w64-x86-64 > /dev/null
          cd server
          go vet ./... 2>&1 | tee ../logs/server.log
          go test ./... 2>&1 | tee -a ../logs/server.log
          ./build-windows.sh "$VERSION_NAME" ../dist/RemoteDesktop.exe 2>&1 | tee -a ../logs/server.log

      - name: Android (apk)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace --warning-mode=summary 2>&1 | tee ../logs/android.log
          cp app/build/outputs/apk/release/app-release.apk ../dist/RemoteDesktop.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RemoteDesktop-${{ env.VERSION_NAME }}
          path: dist/*

      - name: Publish rolling "latest" build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Остання збірка ($VERSION_NAME)" \
            --notes "Автоматична збірка з гілки main, коміт $GITHUB_SHA."

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "Remote Desktop $VERSION_NAME" --generate-notes

      - name: Upload logs on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ci-logs --yes --cleanup-tag || true
          gh release create ci-logs logs/* --prerelease --target "$GITHUB_SHA" --title "CI logs" --notes "Failed run ${{ github.run_id }}"
